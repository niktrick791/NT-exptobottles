name: NT-exptobottles
version: '1.0.0'
main: de.niktr.purpur.exptobottles.ExpToBottlesPlugin
author: niktr
website: https://github.com/niktrick791/NT-exptobottles
description: Store and redeem XP in bottles across Minecraft 1.8 through 1.21.4+
commands:
  bottle:
    description: Fülle deine Erfahrung in Flaschen ab
    aliases: [bottlexp, xpbottle, expbottle]
    permission: exptobottles.use
    usage: /<command> [menge|levels L|all|pickup|reload]
permissions:
  exptobottles.use:
    description: Erlaubt das Abfüllen und Einlösen von XP in Flaschen
    default: true
  exptobottles.admin:
    description: Erlaubt administrative Befehle wie /bottle reload
    default: op
